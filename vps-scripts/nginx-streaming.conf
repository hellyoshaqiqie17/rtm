# Nginx Configuration for live.rtm.tl & radio.rtm.tl with SSL HTTPS

# TV Streaming Subdomain (HLS M3U8)
server {
    listen 80;
    server_name live.rtm.tl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name live.rtm.tl;

    ssl_certificate /etc/letsencrypt/live/live.rtm.tl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.rtm.tl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /tv {
        proxy_pass http://127.0.0.1:8888/tv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # CORS Headers for Web Player M3U8 playback
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Static Radio Playlist Audio Files
    location /radio-playlists/ {
        alias /var/media/radio-playlists/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Accept-Ranges' 'bytes';
        expires 30d;
        access_log off;
    }
}

# Radio Streaming Subdomain (Icecast Audio Stream)
server {
    listen 80;
    server_name radio.rtm.tl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name radio.rtm.tl;

    ssl_certificate /etc/letsencrypt/live/radio.rtm.tl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.rtm.tl/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Static Radio Playlist Audio Files
    location /radio-playlists/ {
        alias /var/media/radio-playlists/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Accept-Ranges' 'bytes';
        expires 30d;
        access_log off;
    }
}
